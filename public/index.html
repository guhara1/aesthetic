<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Valley Beauty Medical Spa</title>
    <meta http-equiv="refresh" content="0; url=/en/" />
    <script>
      (function () {
        var supported = ["en", "zh", "ko", "ja"];
        var stored = (document.cookie.match(/(?:^|; )NEXT_LOCALE=([^;]+)/) || [])[1];
        var lang = stored || (navigator.language || "en").toLowerCase().split("-")[0];
        var target = supported.indexOf(lang) !== -1 ? lang : "en";
        window.location.replace("/" + target + "/");
      })();
    </script>
  </head>
  <body
    style="font-family: system-ui, sans-serif; background: #faf7f1; color: #2a2420"
  >

      <p style="padding: 2rem">

        <a href="/en/">The Valley Beauty Medical Spa</a>.
      </p>
    </noscript>
  </body>
</html>
